<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リンクメニュー</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #f4f6f9;
      font-family: sans-serif;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 30px;
    }
    .grid {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      display: block;
      padding: 24px 16px;
      background: #fff;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      transition: 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
      color: #0066cc;
    }
    .card-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>リンクメニュー</h1>

  <div class="grid">
    <!-- 👇 hrefの中身を実際のファイル名（またはURL）に合わせる -->
    <a class="card" href="イルカは羽ばたき空を超えその先を見た2.html">
      <div class="card-title">イルカは羽ばたき空を超えその先を見た2</div>
      <div class="card-desc">イルカは羽ばたき魚を食べた</div>
    </a>

    <a class="card" href="サルは羽ばたき空を飛ぶ.html">
      <div class="card-title">サルは羽ばたき空を飛ぶ</div>
      <div class="card-desc">サルはバナナを食べてよだれがたれた</div>
    </a>

    <a class="card" href="https://example.com/3">
      <div class="card-title">サイト C</div>
      <div class="card-desc">サイトCの説明文</div>
    </a>

    <a class="card" href="https://example.com/4" target="_blank">
      <div class="card-title">サイト D</div>
      <div class="card-desc">新しいタブで開きます</div>
    </a>
  </div>

</body>
</html>
